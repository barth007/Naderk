# Naderk Nginx Configuration
# Production:  naderkela.com        → frontend :3000
#              app-api.naderkela.com → backend  :8000
# Staging:     dev-frontend.naderkela.com → frontend :3001
#              dev-api.naderkela.com      → backend  :8001
#
# Setup steps:
#   1. Copy to /etc/nginx/sites-available/naderk
#   2. ln -s /etc/nginx/sites-available/naderk /etc/nginx/sites-enabled/naderk
#   3. nginx -t
#   4. systemctl reload nginx
#   5. certbot --nginx -d naderkela.com -d app-api.naderkela.com \
#                     -d dev-frontend.naderkela.com -d dev-api.naderkela.com \
#                     -d media.naderkela.com -d dev-media.naderkela.com

# ── Production Frontend — naderkela.com ───────────────────────────────────────
server {
    listen 80;
    server_name naderkela.com www.naderkela.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Production Backend API — app-api.naderkela.com ────────────────────────────
server {
    listen 80;
    server_name app-api.naderkela.com;

    client_max_body_size 50M;

    # Root of the API host. Without this, `/` never reaches Django and nginx
    # serves its own default page instead — which reads as a broken deployment.
    location = / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Django Channels)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}

# ── Object storage (MinIO) — media.naderkela.com / dev-media.naderkela.com ────
# Uploaded images are stored with an absolute URL built from
# MINIO_PUBLIC_ENDPOINT. Without a public hostname in front of MinIO there is no
# valid value for that setting, so uploads got internal URLs ("http://minio:9000")
# that browsers cannot load — every product image, frame image and the site logo
# rendered broken. These vhosts give the public bucket a real address.
#
# After enabling, set in BackEnd/.env.production and BackEnd/.env.dev:
#   MINIO_ENDPOINT=http://minio:9000                    (internal, unchanged)
#   MINIO_PUBLIC_ENDPOINT=https://media.naderkela.com   (prod)
#   MINIO_PUBLIC_ENDPOINT=https://dev-media.naderkela.com  (staging)
server {
    listen 80;
    server_name media.naderkela.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Objects are content-addressed, so they can be cached hard.
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}

# Staging. docker-compose.yml exposes MinIO on ${MINIO_HOST_PORT:-9000} so that
# dev and prod instances can coexist — if staging runs its own MinIO on a
# different host port, change 9000 below to match. If both environments share a
# single MinIO, point this at 9000 too and use separate buckets.
server {
    listen 80;
    server_name dev-media.naderkela.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
}

# ── Staging Frontend — dev-frontend.naderkela.com ─────────────────────────────
