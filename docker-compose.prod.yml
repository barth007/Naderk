# Application services — web, celery, frontend.
# Infrastructure (db, redis, livekit) is managed by docker-compose.yml.
#
# Env files on the server:
#   Production  → BackEnd/.env.production      FrontEnd/frontend/.env.production
#   Staging/Dev → BackEnd/.env.dev             FrontEnd/frontend/.env.dev
#
# The ENVIRONMENT variable is injected by the deploy workflow.
# Default falls back to "production" for manual local use.

services:
  web:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile.prod
    env_file:
      - ./BackEnd/.env.${ENVIRONMENT:-production}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      - db
      - redis
    networks:
      - naderk_net

  celery-worker:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile.prod
    entrypoint: ["./entrypoint.sh"]
    command: ["celery", "-A", "config.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - ./BackEnd/.env.${ENVIRONMENT:-production}
    restart: unless-stopped
    depends_on:
      - db
      - redis
    networks:
      - naderk_net

  celery-beat:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile.prod
    entrypoint: ["./entrypoint.sh"]
    command: ["celery", "-A", "config.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ./BackEnd/.env.${ENVIRONMENT:-production}
    restart: unless-stopped
    depends_on:
      - db
      - redis
    networks:
      - naderk_net

  frontend:
    build:
      context: ./FrontEnd/frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
    env_file:
      - ./FrontEnd/frontend/.env.${ENVIRONMENT:-production}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - web
    networks:
      - naderk_net

# Project-scoped, matching docker-compose.yml. This was `external: true`, which
# made every environment's containers join one shared `naderk_net`. With dev and
# prod on the same host that meant `db`, `redis` and `minio` each resolved to TWO
# containers, and Docker's DNS round-robins between them — so production was
# reading and writing to the dev database roughly half the time, and products
# appeared to vanish at random.
#
# Compose now creates `<project>_naderk_net` per deploy directory, so each
# environment can only see its own services.
networks:
  naderk_net:
    driver: bridge

# Likewise project-scoped. A shared external volume would put two Postgres
# servers on one data directory.
volumes:
  postgres_data:
